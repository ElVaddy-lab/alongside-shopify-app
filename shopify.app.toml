# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "bffe3e22be73e7b4f9bf1a385014e409"
application_url = "https://example.com"
embedded = true
name = "Alongside"
description = "Set by the app: the automatic discount that applies this offer."

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,write_discounts,write_metaobject_definitions,write_metaobjects"

# One entry per upsell offer. The admin writes it; the theme app extension reads it
# in Liquid, so the storefront never calls the app server.
# Turning an offer on or off = publishing the entry (active / draft);
# Liquid loops return active entries only.
[metaobjects.app.upsell_offer]
name = "Upsell offer"
description = "An add-on offered in the cart and on the product page; its discount is applied by the Alongside discount function."
display_name_field = "title"
access.admin = "merchant_read_write"
access.storefront = "public_read"
capabilities.publishable = true

[metaobjects.app.upsell_offer.fields.title]
name = "Internal name"
description = "Shown only in the Alongside admin and in Discounts."
type = "single_line_text_field"
required = true

[metaobjects.app.upsell_offer.fields.heading]
name = "Heading shown to customers"
description = "Shown to customers above the add-ons and in the discount line, e.g. Complete your setup."
type = "single_line_text_field"
required = true

[metaobjects.app.upsell_offer.fields.trigger_products]
name = "Trigger products"
description = "The offer shows when one of these products is in the cart or on its product page."
type = "list.product_reference"
required = true
validations."list.min" = 1

[metaobjects.app.upsell_offer.fields.offer_products]
name = "Offered products"
description = "Add-ons offered at the discount (1 to 3)."
type = "list.product_reference"
required = true
validations."list.min" = 1
validations."list.max" = 3

[metaobjects.app.upsell_offer.fields.discount_type]
name = "Discount type"
description = "percentage or fixed_amount (off each add-on unit)."
type = "single_line_text_field"
required = true
validations.choices = ["percentage", "fixed_amount"]

[metaobjects.app.upsell_offer.fields.discount_value]
name = "Discount value"
description = "Percent (0-100) or amount in the store currency."
type = "number_decimal"
required = true
validations.min = 0

[metaobjects.app.upsell_offer.fields.show_on_product]
name = "Show on product page"
description = "Show the offer in the Alongside block on the trigger product page."
type = "boolean"

[metaobjects.app.upsell_offer.fields.show_in_cart]
name = "Show in cart"
description = "Show the offer in the cart (Alongside app embed)."
type = "boolean"

[metaobjects.app.upsell_offer.fields.discount_id]
name = "Automatic discount ID"
description = "Set by the app: the automatic discount that applies this offer."
type = "single_line_text_field"

[webhooks]
api_version = "2026-10"

  # Handled by: /app/routes/webhooks.app.uninstalled.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  # Handled by: /app/routes/webhooks.app.scopes_update.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # Mandatory privacy compliance topics.
  # Handled by: /app/routes/webhooks.compliance.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
